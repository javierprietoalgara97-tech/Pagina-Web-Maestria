<!--
  SECCIÓN 09 — Galería: Nuestra Clínica
  Se mantiene el carrusel del Fragmento 05 con dos ajustes del documento:
  1) Titular "Nuestra Clínica" + frase de pie introductoria.
  2) Nota de revisión de orientación de imágenes (ajustar object-position si alguna sale invertida).
-->

<div class="sba-galeria">

  <div class="sba-galeria__header sba-gal-reveal">
    <h2 class="sba-galeria__h2">Nuestra Clínica</h2>
    <p class="sba-galeria__intro">Esta es la clínica donde vas a pasar tu jornada. No es un decorado para fotos: aquí tratamos cada día a los pacientes que sostienen los 300 casos al año.</p>
  </div>

  <div class="sba-carousel-wrap sba-gal-reveal">
    <button class="sba-arrow sba-prev" aria-label="Imagen anterior">‹</button>

    <div class="sba-carousel">
      <div class="sba-carousel-track">
        <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2161305203/settings_images/aef460-a6ce-be1d-20e2-0b8544586c2_IMG_6933_1_.png" alt="Clínica Common Sense Aligners">
        <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2161305203/settings_images/e2a53da-1cbb-3dd0-54e3-6d2324edadb4_foto_javi_2.png" alt="Dr. Javier Lozano en consulta">
        <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2161305203/settings_images/a781ce-bfd0-38b-7a75-b15f62bcda7_IMG_0386.png" alt="Interior de la clínica">
        <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2161305203/settings_images/074a2a4-5acb-a33c-8e6b-df8b655687_IMG_7354.png" alt="Equipo de la clínica">
        <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2161305203/settings_images/cb07d4c-d18-16da-bba6-00c85ac506_foto_javi_1.png" alt="Dr. Javier Lozano">
        <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/themes/2161305203/settings_images/8a5ab1b-e47b-351a-e3ed-1483ac7833_IMG_0001.png" alt="Instalaciones de la clínica">
      </div>
    </div>

    <button class="sba-arrow sba-next" aria-label="Imagen siguiente">›</button>
  </div>

</div>

<style>
  .sba-galeria {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .sba-galeria__h2 {
    margin: 0 0 12px 0;
    font-size: clamp(28px, 3.5vw, 44px);
    font-weight: 800;
    line-height: 1.12;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .sba-galeria__intro {
    margin: 0;
    font-size: 16px;
    line-height: 1.65;
    color: rgba(255,255,255,0.72);
    max-width: 680px;
  }

  /* ===== CARRUSEL (idéntico al Fragmento 05) ===== */
  :root {
    --glass-bg: rgba(255,255,255,.12);
    --glass-border: rgba(255,255,255,.25);
  }

  .sba-carousel-wrap {
    position: relative;
    width: 100%;
    perspective: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sba-carousel {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 22px;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 35px 80px rgba(0,0,0,.40),
      0 18px 40px rgba(0,0,0,.20);
  }

  .sba-carousel::before {
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.05));
    pointer-events:none;
    z-index:1;
  }

  .sba-carousel-track {
    display: flex;
    transition: transform .9s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
    position: relative;
    z-index: 2;
  }

  .sba-carousel-track img {
    width: 100%;
    flex-shrink: 0;
    object-fit: cover;
    backface-visibility: hidden;
  }

  .sba-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%) scale(1);
    z-index: 10;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,.9);
    color: #0b0b0f;
    font-size: 32px;
    box-shadow: 0 14px 30px rgba(0,0,0,.25);
    transition:
      transform .35s cubic-bezier(.22,.61,.36,1),
      box-shadow .35s ease,
      background .35s ease;
    animation: sbaArrowPulse 2.8s ease-in-out infinite;
  }

  .sba-prev { left: -72px; }
  .sba-next { right: -72px; }

  @keyframes sbaArrowPulse {
    0%,100%{ transform: translateY(-50%) scale(1); }
    50%{ transform: translateY(-50%) scale(1.18); }
  }

  @media (hover:hover) and (pointer:fine) {
    .sba-arrow:hover {
      transform: translateY(-50%) scale(1.35);
      box-shadow: 0 22px 45px rgba(0,0,0,.35);
      background: #fff;
    }
  }

  @media (max-width:640px) {
    .sba-prev { left: 10px; }
    .sba-next { right: 10px; }
    .sba-arrow { width: 44px; height: 44px; font-size: 26px; }
  }

  /* ===== REVEAL ===== */
  .sba-gal-reveal {
    opacity: 0;
    transform: translateY(28px);
  }
  .sba-gal-reveal.sba-gal-visible {
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity 1.0s cubic-bezier(.22,.61,.36,1),
      transform 1.0s cubic-bezier(.22,.61,.36,1);
  }

  @media (prefers-reduced-motion: reduce) {
    .sba-arrow { animation: none !important; }
    .sba-carousel-track { transition: none !important; }
    .sba-gal-reveal { opacity: 1 !important; transform: none !important; }
  }
</style>

<script>
(function(){
  // Reveal
  const revealEls = document.querySelectorAll('.sba-gal-reveal');
  if (revealEls.length) {
    const ioReveal = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('sba-gal-visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(el => ioReveal.observe(el));
  }

  // Carrusel
  const track = document.querySelector('.sba-carousel-track');
  if (!track) return;
  const slides = track.querySelectorAll('img');
  const prev = document.querySelector('.sba-prev');
  const next = document.querySelector('.sba-next');
  let index = 0;

  function update(){
    track.style.transform = `translateX(-${index * 100}%)`;
  }

  next.addEventListener('click', () => { index = (index + 1) % slides.length; update(); });
  prev.addEventListener('click', () => { index = (index - 1 + slides.length) % slides.length; update(); });
})();
</script>
